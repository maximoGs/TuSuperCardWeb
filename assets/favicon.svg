<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="cardBgGrad" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base redondeada exterior -->
  <rect width="100" height="100" rx="24" fill="#07090e"/>
  
  <!-- Tarjeta Inteligente Inclinada -->
  <rect x="14" y="20" width="72" height="60" rx="12" fill="url(#cardBgGrad)" stroke="url(#blueGlow)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Microchip / Núcleo Inteligente -->
  <rect x="24" y="32" width="16" height="13" rx="3" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1.2"/>
  <line x1="28" y1="32" x2="28" y2="45" stroke="#60a5fa" stroke-width="0.8" opacity="0.6"/>
  <line x1="32" y1="32" x2="32" y2="45" stroke="#60a5fa" stroke-width="0.8" opacity="0.6"/>
  <line x1="36" y1="32" x2="36" y2="45" stroke="#60a5fa" stroke-width="0.8" opacity="0.6"/>

  <!-- Ondas NFC / Contactless -->
  <path d="M64 33 A 12 12 0 0 1 64 45" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M70 29 A 18 18 0 0 1 70 49" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M76 25 A 24 24 0 0 1 76 53" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Indicador de Código QR en Miniatura -->
  <g fill="#38bdf8" opacity="0.9">
    <rect x="24" y="56" width="14" height="14" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="27" y="59" width="8" height="8" rx="1" fill="#38bdf8"/>
    <circle cx="50" cy="63" r="2" fill="#60a5fa"/>
    <circle cx="58" cy="63" r="2" fill="#818cf8"/>
    <circle cx="66" cy="63" r="2" fill="#a78bfa"/>
  </g>
</svg>
